name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug. Please fill out the form below.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Where does it happen? (scripts/github.test.ts keeps this list in step with apps/.)
      options:
        - apps/www (marketing site)
        - apps/app (application)
        - apps/auth (sign-in, admin)
        - apps/account (account settings)
        - apps/docs (docs)
        - apps/help (help)
        - apps/jobs (jobs)
        - apps/blog (blog)
        - apps/api (API service)
        - apps/ai (AI service)
        - apps/story (Storybook)
        - apps/e2e (end-to-end tests)
        - apps/load (load tests)
        - packages/* (a shared package)
        - Docker, CI or tooling
        - Several areas
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g., macOS 14.0, Windows 11

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
