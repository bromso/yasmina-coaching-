name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the form below.

  - type: dropdown
    id: area
    attributes:
      label: Target area
      description: Where would it live? (scripts/github.test.ts keeps this list in step with apps/.)
      options:
        - apps/www (marketing site)
        - apps/app (application)
        - apps/auth (sign-in, admin)
        - apps/account (account settings)
        - apps/docs (docs)
        - apps/help (help)
        - apps/jobs (jobs)
        - apps/blog (blog)
        - apps/api (API service)
        - apps/ai (AI service)
        - apps/story (Storybook)
        - apps/e2e (end-to-end tests)
        - apps/load (load tests)
        - packages/* (a shared package)
        - Docker, CI or tooling
        - Several areas
        - A new app or package
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      options:
        - New feature
        - Enhancement to existing feature
        - UI/UX improvement
        - Performance improvement
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: A clear description of what the problem is. Ex. I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: A clear description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Examples
      description: If applicable, add mockups, screenshots, or links to similar implementations.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the feature request here.
